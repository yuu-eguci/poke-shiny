name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker compose build

      - name: Lint
        run: |
          docker compose run --rm app ruff check .
          docker compose run --rm app ruff format --check .

      - name: Test
        run: docker compose run --rm app xvfb-run -a pytest

      - name: CLI
        run: |
          docker compose run --rm -T app python poke_shiny.py --rate 8 | grep -E "^Hey! I'm [0-9]+(st|nd|rd|th) brother\.$"
          docker compose run --rm -T app python poke_shiny.py --rate 8 --times 100 | grep -E '^Average: [0-9.]+ eggs \(100 times\)$'

      - name: GUI starts and noVNC responds
        run: |
          docker compose up -d
          for i in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6080/vnc.html && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:6080/vnc.html
          docker compose exec -T app python -c "import socket; print(socket.create_connection(('localhost', 5900)).recv(12))" | grep 'RFB'
          docker compose top app | grep 'poke_shiny.py'

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Browser E2E via noVNC
        run: |
          uv run --only-group e2e playwright install --with-deps chromium
          uv run --only-group e2e python e2e/novnc_check.py screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down
