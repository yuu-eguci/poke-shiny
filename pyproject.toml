[project]
name = "poke-shiny"
version = "1.0.0"
description = "色違いイーブイが何個目の卵で生まれるかシミュレートする tkinter アプリ"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
e2e = [
    "playwright>=1.64.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
